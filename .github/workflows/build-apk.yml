name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p /tmp/bak && cp -r lib pubspec.yaml /tmp/bak/
          flutter create --platforms=android --org ir.kashan --project-name kashan_energy .
          rm -rf lib && cp -r /tmp/bak/lib lib && cp /tmp/bak/pubspec.yaml pubspec.yaml
          rm -rf test

      - name: Set minSdk 24
        run: |
          f=$(ls android/app/build.gradle*)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f"
          grep -n "minSdk" "$f"

      - name: Restore fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "fixed key restored"; else echo "WARNING: DEBUG_KEYSTORE_B64 not set"; fi

      - name: Patch manifest
        run: |
          m=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:allowBackup="false"#' "$m"
          grep -n "allowBackup\|INTERNET" "$m"

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kashan-energy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
