
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate Android project while preserving original Dart source
      - name: Generate Android project
        run: |
          mkdir -p /tmp/bak
          cp -r lib pubspec.yaml /tmp/bak/

          flutter create \
            --platforms=android \
            --org ir.kashan \
            --project-name kashan_energy .

          rm -rf lib
          cp -r /tmp/bak/lib lib
          cp /tmp/bak/pubspec.yaml pubspec.yaml
          rm -rf test

      # Set minimum Android SDK to 24
      - name: Set minSdk 24
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path("android/app").glob("build.gradle*"))
          if not files:
              raise SystemExit("app Gradle file not found")

          f = files[0]
          content = f.read_text()

          content = re.sub(
              r'minSdk\s*=\s*flutter\.minSdkVersion',
              'minSdk = 24',
              content
          )

          content = re.sub(
              r'minSdkVersion\s+flutter\.minSdkVersion',
              'minSdkVersion 24',
              content
          )

          f.write_text(content)
          print(f"Updated {f}")
          print("\n".join(
              line for line in content.splitlines()
              if "minSdk" in line
          ))
          PY

      # Restore fixed signing key
      - name: Restore fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Fixed signing key restored"
          else
            echo "WARNING: DEBUG_KEYSTORE_B64 not set"
          fi

      # Patch Android manifest
      - name: Patch manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          m = Path("android/app/src/main/AndroidManifest.xml")
          content = m.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in content:
              content = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission,
                  content,
                  count=1
              )

          content = re.sub(
              r'<application\b',
              '<application android:allowBackup="false"',
              content,
              count=1
          ) if 'android:allowBackup=' not in content else content

          m.write_text(content)

          print("Manifest patched:")
          for line in content.splitlines():
              if "INTERNET" in line or "allowBackup" in line:
                  print(line)
          PY

      # Install dependencies
      - name: Get dependencies
        run: flutter pub get

      # Disable only the problematic release vital lint task
      - name: Patch Android Lint
        run: |
          f=$(find android/app -maxdepth 1 -name 'build.gradle*' | head -n 1)

          cat >> "$f" <<'EOF'

          // Workaround for Android Lint compatibility issue in release builds
          tasks.configureEach {
              if (name == "lintVitalAnalyzeRelease") {
                  enabled = false
              }
          }
          EOF

          echo "Patched: $f"

      # Build APK
      - name: Build Release APK
        run: flutter build apk --release

      # Upload APK
      - uses: actions/upload-artifact@v4
        with:
          name: kashan-energy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
